[[chatbot.programs]]
name = "Nutritional Medicine"
patterns = ["nutritional medicine"]
degrees = ["Master"]

[[chatbot.programs]]
name = "Biophysik"
patterns = ["biophysik"]
degrees = ["Bachelor", "Master"]

[[chatbot.programs]]
name = "Klinische Psychologie und Psychotherapie"
patterns = ["klinische[nr]?\\s+psychologie", "psychotherapie"]
degrees = ["Master"]

[[chatbot.programs]]
name = "Psychologie – Cognitive Systems"
patterns = ["cognitive systems"]
