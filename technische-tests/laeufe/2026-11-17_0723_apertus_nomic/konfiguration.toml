[retrieval]
# Anzahl der Chunks, die dem Sprachmodell übergeben werden
top_k = 5
# Anzahl der Treffer je Suchverfahren, die in die Zusammenführung eingehen
candidates = 20
# Konstante k der Reciprocal Rank Fusion (Cormack et al. 2009)
rrf_k = 60
# Suchtiefe der Näherungssuche im HNSW-Graphen (Kandidatenliste je Anfrage). Mit der
# Voreinstellung von Chroma fehlten teils alle wirklich ähnlichsten Chunks; mit 2000 stimmen
# die Treffer nahezu mit einer exakten Suche überein, bei rund 15 ms je Anfrage.
ef_search = 2000

[llm]
# Schlüssel des aktiven Modells aus [llm.models]
active = "apertus"
# Lokaler Inferenzserver (mlx_lm.server) mit OpenAI-kompatibler Schnittstelle;
# die Adresse ist nur auf diesem Rechner erreichbar.
server_url = "http://127.0.0.1:8080/v1"
# Temperatur 0 erzeugt deterministische, reproduzierbare Antworten.
temperature = 0.0
# Obergrenze der erzeugten Token je Antwort
max_tokens = 512
# Wartezeit auf eine Antwort in Sekunden
timeout = 180.0
# Argumente für die Chat-Vorlage der Modelle. Der Denkmodus ("Thinking") von Apertus
# und Qwen3 wird abgeschaltet, da er die Antwortzeit stark erhöht.
chat_template_args = { enable_thinking = false }

# Alle Modelle sind mit mlx-lm auf 4 Bit quantisiert (Gruppengröße 64, affin).
# Die Revision legt den genauen Stand des Repositorys fest.
[llm.models.apertus]
repo = "TyKaoz/Apertus-v1.5-8B-text-4bit"
revision = "c6a6878bff8a4352467faf74615565f0f9907dc8"

[llm.models.eurollm]
repo = "luiscalisto/EuroLLM-9B-Instruct-2512-MLX-4bit"
revision = "4caf14fe88c613cbc80247e46d5a9612cb741694"

[llm.models.qwen3]
repo = "mlx-community/Qwen3-8B-4bit"
revision = "545dc4251c05440727734bcd94334791f6ab0192"

[embedding]
# Schlüssel des aktiven Modells aus [embedding.models]
active = "nomic"
# Maximale Eingabelänge beider Modelle in Token
max_tokens = 512
# Anzahl der Chunks, die gemeinsam eingebettet werden
batch_size = 16

# Jedes Modell erwartet eigene Präfixe vor Anfragen und Chunks (siehe Modellbeschreibungen).
[embedding.models.nomic]
repo = "nomic-ai/nomic-embed-text-v2-moe"
query_prefix = "search_query: "
document_prefix = "search_document: "
# Das Modell bringt eigenen Code für seine Architektur mit.
trust_remote_code = true

[embedding.models.e5]
repo = "intfloat/multilingual-e5-large-instruct"
# Nur Anfragen erhalten eine Aufgabenbeschreibung, Chunks keinen Präfix.
query_prefix = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
document_prefix = ""
trust_remote_code = false

[keyword_index]
# Sprache für Stemming und Stoppwörter der lexikalischen Suche
language = "german"

[tests]
# Testdatensatz und Ordner der Testläufe, relativ zum Projektordner
testset = "technische-tests/testdatensatz.csv"
runs_dir = "technische-tests/laeufe"
# Vor jeder Messung gestellt, damit Modelle und Zwischenspeicher geladen sind. Die Fragen
# stammen nicht aus dem Testdatensatz und gehen nicht in die Ergebnisse ein.
warmup_questions = [
    "Was ist das Studium Generale?",
    "Wo finde ich den Lageplan des Campus?",
    "Wie kann ich mich exmatrikulieren?",
]

# Externes Bewerter-LLM. Übermittelt werden nur Testfragen, Auszüge der öffentlichen
# Webseite und Antworten des Chatbots. Der Schlüssel steht in der Umgebungsvariable
# ANTHROPIC_API_KEY, nicht in dieser Datei. Kostenpflichtig (etwa 3 $ je Lauf), daher
# nur für Läufe, bei denen der Chatbot als fertig gilt.
[tests.judge]
provider = "anthropic"
model = "claude-opus-5-5"
# Denktiefe des Bewerters (low, medium, high, xhigh, max)
effort = "medium"
prompt = "technische-tests/bewerter-prompt.txt"
pause_seconds = 1.0
retry_seconds = 30.0
max_attempts = 5
